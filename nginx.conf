# GEM Group — Nginx Production Reverse Proxy Configuration
# Serves Vite React SPA at root while preserving WordPress at /blog/ under the exact same domain

server {
    listen 80;
    server_name geminfinity.co.in www.geminfinity.co.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name geminfinity.co.in www.geminfinity.co.in;

    root /var/www/geminfinity/dist;
    index index.html;

    # 1. WordPress Blog Pass-Through on the exact same domain
    location /blog/ {
        proxy_pass http://127.0.0.1:8080/blog/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WordPress Static Assets
    location ~* ^/(wp-content|wp-includes|wp-admin|wp-json)/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 2. Vite React SPA Static Assets (with aggressive caching)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 3. Vite React SPA HTML5 History Routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
